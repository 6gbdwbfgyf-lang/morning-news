name: 朝のニュースを作る

on:
  schedule:
    # GitHub の cron は UTC。21:40 UTC = 日本時間 6:40。
    # GitHub側の混雑で数分〜十数分遅れることがあるため、7時に間に合うよう早めに開始する。
    - cron: "40 21 * * *"
  workflow_dispatch: {}   # Actions 画面の「Run workflow」から手動実行もできる

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ニュースを取得して要約
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # 無料AI要約(Google AI Studioで発行)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}                # 空なら自動で選ぶ
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 登録すると Claude 要約(有料)
        run: python scripts/build_digest.py

      - name: 結果を保存(GitHub Pages に反映される)
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "朝のニュース $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
